<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robotics News</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Robotics News</h1>
      <p class="tagline">Headlines from IEEE Spectrum, The Robot Report, Robohub, MIT and TechCrunch in one feed.</p>
      <div class="row g-2 mt-3 align-items-center">
        <div class="col-12 col-md">
          <input id="search" type="search" class="form-control" placeholder="Search headlines, e.g. humanoid, drone, ROS" aria-label="Search headlines">
        </div>
        <div class="col-6 col-md-auto">
          <button id="savedToggle" class="btn btn-outline-warning w-100" aria-pressed="false">Saved (<span id="savedCount">0</span>)</button>
        </div>
        <div class="col-6 col-md-auto">
          <button id="refresh" class="btn btn-warning w-100">Refresh</button>
        </div>
      </div>
      <div id="chips" class="chips mt-3" role="group" aria-label="Filter by source"></div>
    </div>
  </header>

  <main class="container py-4">
    <div id="status" class="status" role="status"></div>
    <div id="grid" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
